<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>彰化三巡府｜管理系統登入</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#e6f2ed,#f8f7ef);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#123e48}main{width:min(410px,calc(100% - 30px));background:white;border-radius:22px;padding:38px;box-shadow:0 20px 55px #164a4723;border:1px solid #e2eae7}h1{text-align:center;margin:8px 0 3px;letter-spacing:4px}p{text-align:center;color:#77918f;font-size:14px;margin:0 0 26px}.mark{text-align:center;font-size:40px}label{display:block;margin:14px 0 7px;font-size:14px;font-weight:700}input{width:100%;padding:13px;border:1px solid #cbdcda;border-radius:10px;font-size:16px}button{width:100%;margin-top:25px;border:0;border-radius:10px;background:#087f7a;color:white;padding:14px;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.error{color:#b02f37;font-size:13px;margin-top:13px;text-align:center;min-height:20px}small{display:block;text-align:center;color:#96aaa7;margin-top:15px}</style></head><body><main><div class="mark">🏮</div><h1>彰化三巡府</h1><p>宮廟智慧管理系統 · 帳號登入</p><form id="form"><label for="username">登入帳號</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">登入密碼</label><input type="password" id="password" name="password" autocomplete="current-password" required><button id="submit">登入管理系統</button><div class="error" role="alert" id="error"></div></form><small>請妥善保管個人登入資料</small></main><script>
const errorBox=document.getElementById('error');
function showError(message){errorBox.textContent=message;}
async function fetchJson(url,options={}){
 let response;
 try{response=await fetch(new URL(url,window.location.href).href,{credentials:'same-origin',cache:'no-store',...options});}
 catch(ex){throw new Error('連線失敗（'+String(ex.name||'NetworkError')+'）：'+String(ex.message||'無法連接登入 API')+'。請確認 Railway 的 Node 後端正在執行。');}
 const kind=response.headers.get('content-type')||'';
 if(!kind.includes('application/json')){
   throw new Error('登入服務回傳了網頁而非 API 資料（HTTP '+response.status+'）。請確認 Railway Start Command 是 npm start，並且已上傳 server.js、package.json 與 public 資料夾。');
 }
 let data;
 try{data=await response.json();}catch{throw new Error('登入服務回傳無法解析的資料（HTTP '+response.status+'）。');}
 if(!response.ok)throw new Error(data.error||('登入服務錯誤 HTTP '+response.status));
 return data;
}
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;showError('');
 try{await fetchJson('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});window.location.assign('/');}
 catch(ex){showError(ex.message||'登入失敗');btn.disabled=false;}
});
fetchJson('/api/me').then(()=>window.location.assign('/')).catch(()=>{});
</script></body></html>
