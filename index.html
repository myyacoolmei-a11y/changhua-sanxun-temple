) 76%),url('temple-banner.png') right center/auto 100% no-repeat,#f8f5eb;position:relative;padding:32px 46px;box-shadow:0 5px 22px #1d45400b;border:1px solid #e8ebe3}.hero:after{content:'☁ ﹏﹏ ☁';position:absolute;bottom:-9px;left:34px;font-size:47px;letter-spacing:24px;color:#c9b37d;opacity:.15}.hero .eyebrow{font-size:12px;letter-spacing:4px;color:#bc8d38}.hero h1{font-family:serif;font-size:39px;letter-spacing:6px;margin:13px 0 12px;color:#09364a}.hero p{color:#58717a;font-size:14px;letter-spacing:2px}.hero .motto{align-self:flex-start;writing-mode:vertical-rl;letter-spacing:8px;font-family:serif;font-size:16px;color:#0a4051;background:#f9f9f4a8;border-radius:9px;padding:12px}.sectiontitle{font-size:19px;font-weight:750;margin:6px 0 20px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin:18px 0}.stat{background:#fff;border:1px solid #edf0ed;border-radius:17px;padding:20px 16px;box-shadow:0 4px 18px #26413908;min-height:127px}.stat .label{font-size:13px;color:#536d77}.stat .num{font-size:27px;font-weight:800;margin:9px 0 3px;letter-spacing:.3px}.stat .up{font-size:12px;color:#078f62}.stat .ico{float:right;font-size:25px;border-radius:50%;padding:9px;background:#edf7f5}.panels{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}.panel{background:#fff;border:1px solid #ecf0ed;border-radius:18px;padding:22px;min-height:345px;box-shadow:0 4px 18px #26413908}.panel h3{font-size:17px;margin:0 0 18px}.muted{color:var(--muted)}.activity{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf0ef}.date{background:#edf5f6;color:#17475b;border-radius:10px;text-align:center;padding:9px;min-width:56px;font-size:12px}.date strong{display:block;font-size:20px}.activity .name{font-weight:700;font-size:14px}.activity .meta{font-size:12px;color:#8ba0a5;margin-top:6px}.tag{margin-left:auto;border-radius:20px;padding:5px 9px;background:#e8f7ed;color:#15905d;font-size:11px;white-space:nowrap}.todo{padding:13px 0;border-bottom:1px solid #edf0ef;display:flex;gap:10px;font-size:13px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#e5b958;flex-shrink:0}.dot.red{background:#e95b59}.dot.blue{background:#9cc9d8}.todo time{margin-left:auto;color:#91a0a8}.reminder{background:#f6f8f8;border-radius:10px;padding:12px;margin:9px 0;font-size:13px}.bars{height:145px;display:flex;align-items:end;justify-content:space-around;border-bottom:1px solid #e7ecec;padding:0 10px;gap:12px}.bar{flex:1;max-width:39px;background:linear-gradient(#80c7b8,#087f7a);border-radius:4px 4px 0 0;position:relative}.bar:after{content:attr(data-month);position:absolute;bottom:-25px;left:0;right:0;text-align:center;color:#8ca1a7;font-size:12px}.chartcaption{margin-top:42px;font-size:13px;color:#5b7580}.legend{display:flex;gap:9px;align-items:center;font-size:13px;margin:12px 0}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--teal)}.legend b{margin-left:auto}.moduleHead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:17px}.moduleHead h1{font-size:25px;margin:0}.moduleHead p{color:#82979c;font-size:13px}.primary{background:#087f7a;border:0;color:white;border-radius:10px;padding:11px 18px;font-size:13px}.datawrap{background:white;border-radius:18px;padding:22px;border:1px solid #e8eeec}.filters{display:flex;gap:10px;margin-bottom:20px}.filters input{border:1px solid #e1e9e7;border-radius:9px;padding:12px 14px;min-width:260px;max-width:100%;outline:none}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;background:#f5f8f7;color:#58717a;font-weight:600}td,th{padding:15px 13px;border-bottom:1px solid #edf1ef}td{color:#314e5a}.pill{background:#e9f6f1;color:#087c68;border-radius:30px;padding:5px 10px;font-size:12px}.notice{margin-top:20px;font-size:12px;color:#82969a}.mobileToggle{display:none}@media(max-width:1200px){.stats{grid-template-columns:repeat(3,1fr)}.panels{grid-template-columns:1fr 1fr}.panels .panel:last-child{grid-column:span 2}}@media(max-width:800px){aside{transform:translateX(-100%);z-index:10;transition:transform .2s}aside.open{transform:translateX(0)}.workspace{margin-left:0}.mobileToggle{display:block;background:none;border:0;font-size:23px}.top{padding:0 16px}.search{min-width:0;flex:1}.page{padding:15px}.hero{padding:24px;min-height:190px}.hero h1{font-size:27px}.stats{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.panels .panel:last-child{grid-column:auto}.datawrap{overflow-x:auto}table{min-width:650px}}

</head><body><aside id="side"><div class="brand"><img src="temple-logo.png" alt="彰化三巡府標誌"><h2>彰化三巡府</h2><small>CHANGHUA SANXUN TEMPLE</small><p>宮廟智慧管理系統</p></div><div id="nav"></div></aside><div class="workspace"><header class="top"><button class="mobileToggle" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div class="search">⌕　搜尋信眾、活動、捐款、儀式…</div><div class="admin">♧　<span class="avatar">👤</span> 管理員 ▾</div></header><main class="page" id="content"></main></div><script>
const modules=[['首頁總覽','⌂'],['信眾管理','♧'],['功德箱管理','♡'],['關懷追蹤','☏'],['活動管理','▦'],['生日提醒','♙'],['參與紀錄','▤'],['財務管理','▥'],['儀式管理','♧'],['友宮管理','♜'],['宮務行政','⚙']];
const sample={信眾管理:{cols:['信眾姓名','聯絡電話','生日（國曆）','家庭成員','狀態'],rows:[['王小明','09XX-XXX-123','1980/06/12','3 位','正常'],['林美玲','09XX-XXX-456','1975/10/20','2 位','正常'],['陳大華','09XX-XXX-789','1992/04/18','4 位','正常']]},功德箱管理:{cols:['捐款日期','捐款人','捐款項目','金額','收據'],rows:[['2026/10/12','王小明','建廟功德','NT$ 3,000','已開立'],['2026/10/08','林美玲','香油錢','NT$ 1,200','已開立']]},關懷追蹤:{cols:['信眾','上次聯繫','關懷內容','下次提醒','負責人'],rows:[['李小明','2026/10/10','身體關懷','2026/10/18','陳幹事'],['林美玲','2026/10/07','家庭近況','2026/10/20','王幹事']]},活動管理:{cols:['活動名稱','活動日期','報名人數','活動費用','狀態'],rows:[['哪吒元帥聖誕法會','2026/10/25','35','NT$ 500','報名中'],['普渡法會','2026/11/08','52','NT$ 300','籌備中']]},生日提醒:{cols:['信眾姓名','國曆生日','農曆生日','祝福紀錄','提醒'],rows:[['林美玲','10/20','九月初九','尚未祝福','待祝福'],['陳大華','10/22','九月十一','已傳訊','已完成']]},參與紀錄:{cols:['信眾','活動參與','儀式辦理','累計捐款','最近參與'],rows:[['王小明','5 次','3 次','NT$ 8,000','2026/10/12'],['林美玲','3 次','2 次','NT$ 5,200','2026/10/08']]},財務管理:{cols:['日期','類別','摘要','收入','支出'],rows:[['2026/10/12','功德捐款','建廟功德','NT$ 3,000','—'],['2026/10/13','活動支出','活動布置','—','NT$ 1,500']]},儀式管理:{cols:['信眾','儀式項目','辦理日期','費用','狀態'],rows:[['王小明','安太歲','2026/10/20','NT$ 600','待辦理'],['林美玲','點光明燈','2026/10/25','NT$ 500','已登記']]},友宮管理:{cols:['友宮名稱','聯絡人','交流項目','最近參訪','狀態'],rows:[['友宮甲（示範）','陳先生','參香交流','2026/09/20','持續交流'],['友宮乙（示範）','林小姐','活動邀請','2026/10/02','待回覆']]},宮務行政:{cols:['工作事項','負責人','期限','進度','類別'],rows:[['法會場地布置','陳幹事','2026/10/18','進行中','活動'],['普渡名冊整理','王幹事','2026/10/20','待處理','行政'],['宮務例會','總幹事','2026/10/22','已排程','會議']]}};
let current='首頁總覽';function drawNav(){document.getElementById('nav').innerHTML=modules.map(([name,icon])=>`<button class="navitem ${name===current?'active':''}" onclick="go('${name}')"><span>${icon}</span>${name}</button>`).join('')};function go(name){current=name;drawNav();document.getElementById('side').classList.remove('open');if(name==='首頁總覽')home();else modulePage(name)}
function home(){document.getElementById('content').innerHTML=`<div class="hero"><div><div class="eyebrow">—　哪吒元帥　—</div><h1>彰化三巡府</h1><p>護佑眾生・廣結善緣</p><p style="font-size:12px;letter-spacing:1px">四海平安　｜　三巡護佑　｜　風調雨順</p></div><div class="motto">三巡護佑　四海平安</div></div><section class="stats">${[['♟','信眾總數','1,280','8%'],['♥','本月捐款','128,600','8%'],['❀','本月儀式','86','20%'],['▦','本月活動','5','25%'],['♙','本月壽星','32','10%']].map(([i,t,n,p])=>`<div class="stat"><span class="ico">${i}</span><div class="label">${t}</div><div class="num">${n}</div><div class="up">↗ ${p}</div></div>`).join('')}</section><div class="panels"><section class="panel"><h3>▦　近期活動</h3>${[['10','25','哪吒元帥聖誕法會','09:00 - 12:00','報名中'],['11','08','普渡法會','10:00 - 15:00','籌備中'],['12','12','光明燈祈福儀式','10:00 - 11:30','未開始']].map(([m,d,n,t,s])=>`<div class="activity"><div class="date"><strong>${m}/${d}</strong>日期</div><div><div class="name">${n}</div><div class="meta">◷ ${t}　⌖ 三巡府</div></div><span class="tag">${s}</span></div>`).join('')}</section><section class="panel"><h3>▤　待辦事項</h3>${[['red','關懷李小明師兄（身體關懷）','10/18'],['','活動場地布置確認','10/18'],['','整理普渡名冊','10/20'],['blue','寄送壽星祝福訊息','10/20'],['blue','確認友宮參訪名單','10/22']].map(([c,n,t])=>`<div class="todo"><span class="dot ${c}"></span>${n}<time>${t}</time></div>`).join('')}<h3 style="margin-top:25px">♧　今日提醒</h3><div class="reminder">🎂　3 位信眾生日（農曆）</div><div class="reminder">♥　2 位信眾待關懷</div></section><section class="panel"><h3>▥　近 6 個月收入統計</h3><div class="bars">${[48,64,59,82,77,95].map((h,i)=>`<div class="bar" data-month="${i+5}月" style="height:${h}%"></div>`).join('')}</div><div class="chartcaption">收入項目分布</div>${[['點燈安太歲','45%','#078f83'],['法會報名','25%','#65b9c6'],['功德捐款','20%','#e6b13f'],['其他收入','10%','#dfc78b']].map(([n,p,c])=>`<div class="legend"><i style="background:${c}"></i>${n}<b>${p}</b></div>`).join('')}</section></div><div class="notice">展示預覽模式｜本頁數字、活動與名冊皆為虛構示範資料，未連接正式資料庫。</div>`}
function modulePage(name){let d=sample[name];document.getElementById('content').innerHTML=`<div class="moduleHead"><div><h1>${name}</h1><p>彰化三巡府　／　${name}　／　資料總覽</p></div><button class="primary" onclick="alert('目前為設計預覽版，新增功能須於正式資料庫版本啟用。')">＋ 新增${name.replace('管理','').replace('提醒','')}</button></div><div class="datawrap"><div class="filters"><input id="filter" placeholder="⌕ 搜尋${name}資料..." oninput="filterRows()"><span class="muted" style="align-self:center;font-size:12px">示範資料 · 不會儲存修改</span></div><table><thead><tr>${d.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="rows">${d.rows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===r.length-1?`<span class="pill">${v}</span>`:v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice">這是可切換模組的視覺原型，尚未連接登入、PostgreSQL 或正式資料。</div>`}function filterRows(){let q=document.getElementById('filter').value.toLowerCase();document.querySelectorAll('#rows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}go('首頁總覽');
</script>
<style>
.actionbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.secondary{border:1px solid #d8e5e2;background:#fff;color:#0c6969;border-radius:10px;padding:10px 14px}.tiny{padding:6px 10px;font-size:12px}.danger{color:#b64040;border-color:#f0d9d9}.modalBackdrop{position:fixed;inset:0;background:#082a38a3;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}.modalBox{background:#fff;border-radius:19px;width:min(690px,100%);max-height:90vh;overflow:auto;padding:25px;box-shadow:0 24px 90px #001a2940}.modalBox h2{margin:0 0 5px}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:20px 0}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#536e76}.field input,.field select,.field textarea{border:1px solid #dbe5e2;border-radius:9px;padding:11px;width:100%;color:#183e4d;background:#fff}.field textarea{min-height:70px;resize:vertical}.field.wide{grid-column:1/-1}.modalActions{display:flex;justify-content:flex-end;gap:9px}.tableScroll{overflow:auto}.tableScroll table{min-width:850px}.countNote{color:#789199;font-size:12px;margin:10px 0}.top .search{cursor:pointer}.stat{cursor:pointer}.stat:hover{border-color:#acd5cc}@media(max-width:650px){.formGrid{grid-template-columns:1fr}.moduleHead{align-items:flex-start;flex-direction:column}.modalBox{padding:16px}}

<script>
/* Local-only editable demo. No real user information should be entered. */
const storageKey='sanxun-demo-editable-v1';
const fieldMap={
'信眾管理':['姓名','性別','電話','地址','國曆生日','農曆生日','出生時辰','家庭成員','備註'],
'功德箱管理':['捐款日期','捐款人','捐款項目','金額','收據編號','備註'],
'關懷追蹤':['信眾','上次聯繫','關懷內容','下次提醒','負責人','狀態'],
'活動管理':['活動名稱','活動日期','活動時間','地點','報名人數','活動費用','狀態','照片影片連結','活動紀錄'],
'生日提醒':['信眾姓名','國曆生日','農曆生日','祝福紀錄','提醒狀態'],
'參與紀錄':['信眾','參與日期','活動／服務','儀式項目','捐款金額','備註'],
'財務管理':['日期','收支類型','分類','摘要','金額','經手人','備註'],
'儀式管理':['信眾','儀式項目','辦理日期','費用','狀態','備註'],
'友宮管理':['友宮名稱','聯絡人','電話','地址','交流項目','禮金／送禮','最近參訪','活動參與','備註'],
'宮務行政':['工作事項','負責人','期限','進度','類別','會議紀錄','組織成員','備註']};
const choices={'性別':['女','男','其他'],'狀態':['待處理','進行中','已完成','已取消'],'提醒狀態':['待祝福','已完成'],'收支類型':['收入','支出'],'進度':['待處理','進行中','已完成'],'儀式項目':['點燈','安太歲','補運','法會','祭改','迴向','陰債','嬰靈','普渡','其他']};
const originalSamples=JSON.parse(JSON.stringify(sample));
function makeSamples(){const out={};for(const [name,def] of Object.entries(originalSamples)){out[name]=def.rows.map((r,i)=>{let obj={_id:name+'-'+i};def.cols.forEach((k,j)=>{let key=k==='信眾姓名'?'姓名':k==='聯絡電話'?'電話':k==='生日（國曆）'?'國曆生日':k==='捐款人'?'捐款人':k==='捐款項目'?'捐款項目':k==='活動日期'?'活動日期':k==='儀式項目'?'儀式項目':k==='日期'?(name==='功德箱管理'?'捐款日期':'日期'):k==='類別'&&name==='財務管理'?'分類':k==='收入'?'金額':k==='進度'?'進度':k;obj[key]=r[j]});if(name==='財務管理'){obj['收支類型']=r[3]!=='—'?'收入':'支出';obj['金額']=r[3]!=='—'?r[3]:r[4]}if(name==='信眾管理'){obj['備註']='示範資料';obj['性別']='';obj['地址']='';obj['農曆生日']='';obj['出生時辰']=''}if(name==='生日提醒'){obj['姓名']=r[0];obj['提醒狀態']=r[4]}if(name==='儀式管理')obj['儀式項目']=r[1];return obj})}return out}
let db;try{const raw=localStorage.getItem(storageKey);db=raw?JSON.parse(raw):makeSamples()}catch(e){db=makeSamples()}for(const name of Object.keys(fieldMap)){if(!Array.isArray(db[name]))db[name]=[]}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(db));return true}catch(e){alert('無法儲存到瀏覽器，請確認儲存空間或隱私設定。');return false}}
if(!localStorage.getItem(storageKey))persist();
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return Number(String(v||'').replace(/[^0-9.-]/g,''))||0}
function fmt(v){return 'NT$ '+v.toLocaleString('zh-TW')}
function displayVal(k,v){return (k==='金額'||k==='費用'||k==='活動費用'||k==='捐款金額')&&v!==''&&v!=null?esc(String(v).startsWith('NT$')?v:fmt(money(v))):esc(v||'—')}
function newId(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function renderRows(name,q=''){const fields=fieldMap[name];const filtered=db[name].filter(r=>fields.some(k=>String(r[k]||'').toLowerCase().includes(q.toLowerCase())));document.getElementById('rows').innerHTML=filtered.map(r=>`<tr>${fields.map(k=>`<td>${displayVal(k,r[k])}</td>`).join('')}<td style="white-space:nowrap"><button class="secondary tiny" onclick="openEditor('${name}','${r._id}')">編輯</button> <button class="secondary tiny danger" onclick="deleteRecord('${name}','${r._id}')">刪除</button></td></tr>`).join('')||`<tr><td colspan="${fields.length+1}" style="text-align:center;padding:35px;color:#84999e">目前沒有符合的資料</td></tr>`;document.getElementById('count').textContent=`共 ${filtered.length} 筆資料（此裝置示範資料）`}
function modulePage(name){const fields=fieldMap[name];document.getElementById('content').innerHTML=`<div class="moduleHead"><div><h1>${esc(name)}</h1><p>彰化三巡府 ／ ${esc(name)} ／ 資料管理</p></div><div class="actionbar"><button class="secondary" onclick="exportCsv('${name}')">↓ 匯出 CSV</button><button class="primary" onclick="openEditor('${name}')">＋ 新增資料</button></div></div><div class="datawrap"><div class="filters"><input id="filter" placeholder="⌕ 搜尋${esc(name)}..." oninput="renderRows('${name}',this.value)"></div><div class="countNote" id="count"></div><div class="tableScroll"><table><thead><tr>${fields.map(k=>`<th>${esc(k)}</th>`).join('')}<th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="notice">可新增、編輯、刪除示範資料。資料只保存在目前瀏覽器，不會同步到 Railway／PostgreSQL；請勿輸入真實個資。</div>`;renderRows(name)}
function openEditor(name,id){const r=id?db[name].find(x=>x._id===id):null;const fields=fieldMap[name];document.getElementById('editOverlay')?.remove();let html=`<div class="modalBackdrop" id="editOverlay"><div class="modalBox"><h2>${r?'編輯':'新增'}${esc(name)}資料</h2><div class="muted" style="font-size:12px">本機示範資料 · 不會上傳雲端</div><form id="recordForm"><div class="formGrid">${fields.map((k,i)=>{const val=r?.[k]??'';const isLong=/備註|紀錄|關懷內容|家庭成員|地址|連結|摘要/.test(k);const opt=choices[k];const typ=/日期|生日|期限|聯繫|提醒|參訪/.test(k)&&!k.includes('農曆')?'date':/金額|費用|人數/.test(k)?'text':'text';return `<label class="field ${isLong?'wide':''}"><span>${esc(k)}</span>${opt?`<select name="f${i}"><option value="">請選擇</option>${opt.map(v=>`<option value="${esc(v)}" ${val===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:isLong?`<textarea name="f${i}">${esc(val)}</textarea>`:`<input name="f${i}" type="${typ}" value="${esc(val)}" ${i===0?'required':''} placeholder="請輸入${esc(k)}">`}</label>`}).join('')}</div><div class="modalActions"><button type="button" class="secondary" onclick="document.getElementById('editOverlay').remove()">取消</button><button class="primary" type="submit">儲存資料</button></div></form></div></div>`;document.body.insertAdjacentHTML('beforeend',html);document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const record={...(r||{}),_id:r?._id||newId()};fields.forEach((k,i)=>record[k]=String(f.get('f'+i)||'').trim());if(r){const idx=db[name].findIndex(x=>x._id===r._id);db[name][idx]=record}else db[name].unshift(record);persist();document.getElementById('editOverlay').remove();modulePage(name)}}
function deleteRecord(name,id){if(!confirm('確定要刪除這筆示範資料嗎？'))return;db[name]=db[name].filter(x=>x._id!==id);persist();modulePage(name)}
function exportCsv(name){const fields=fieldMap[name];const csv='\ufeff'+[fields,...db[name].map(r=>fields.map(k=>r[k]||''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name+'-示範資料.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function home(){const follower=db['信眾管理'].length;const donations=db['功德箱管理'].reduce((a,r)=>a+money(r['金額']),0);const rituals=db['儀式管理'].length;const activities=db['活動管理'].length;const birthdays=db['生日提醒'].length;const upcoming=db['活動管理'].slice(0,3);const tasks=db['宮務行政'].slice(0,4);document.getElementById('content').innerHTML=`<div class="hero"><div><div class="eyebrow">— 哪吒元帥 —</div><h1>彰化三巡府</h1><p>護佑眾生・廣結善緣</p><p style="font-size:12px;letter-spacing:1px">四海平安　｜　三巡護佑　｜　風調雨順</p></div><div class="motto">三巡護佑　四海平安</div></div><section class="stats">${[['♟','信眾總數',follower,'信眾管理'],['♥','功德捐款',fmt(donations),'功德箱管理'],['❀','儀式登記',rituals,'儀式管理'],['▦','活動紀錄',activities,'活動管理'],['♙','生日提醒',birthdays,'生日提醒']].map(([i,t,n,link])=>`<div class="stat" onclick="go('${link}')"><span class="ico">${i}</span><div class="label">${t}</div><div class="num">${esc(n)}</div><div class="up">查看紀錄 ↗</div></div>`).join('')}</section><div class="panels"><section class="panel"><h3>▦　近期活動 <button class="secondary tiny" style="float:right" onclick="go('活動管理')">查看全部</button></h3>${upcoming.map(r=>`<div class="activity"><div class="date">${esc(r['活動日期']||'待定')}</div><div><div class="name">${esc(r['活動名稱'])}</div><div class="meta">${esc(r['活動時間']||'活動時間待定')}</div></div><span class="tag">${esc(r['狀態']||'已建立')}</span></div>`).join('')||'<p class="muted">尚無活動</p>'}</section><section class="panel"><h3>▤　宮務待辦 <button class="secondary tiny" style="float:right" onclick="go('宮務行政')">查看全部</button></h3>${tasks.map(r=>`<div class="todo"><span class="dot"></span>${esc(r['工作事項'])}<time>${esc(r['期限']||'—')}</time></div>`).join('')||'<p class="muted">尚無待辦事項</p>'}<h3 style="margin-top:24px">♧　關懷提醒</h3><div class="reminder">目前共有 ${db['關懷追蹤'].length} 筆關懷追蹤紀錄</div></section><section class="panel"><h3>▥　財務概覽</h3><div class="chartcaption">示範資料統計</div>${[['功德箱捐款',fmt(donations)],['財務收入',fmt(db['財務管理'].filter(r=>r['收支類型']==='收入').reduce((a,r)=>a+money(r['金額']),0))],['財務支出',fmt(db['財務管理'].filter(r=>r['收支類型']==='支出').reduce((a,r)=>a+money(r['金額']),0))]].map(([k,v])=>`<div class="legend"><i></i>${k}<b>${v}</b></div>`).join('')}<button class="secondary" onclick="go('財務管理')">查看財務明細 →</button></section></div><div class="notice">可編輯示範資料版｜首頁統計依本機示範資料更新。資料不會同步至正式資料庫，請勿輸入真實信眾個資。</div>`}
function filterRows(){renderRows(current,document.getElementById('filter')?.value||'')}
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('editOverlay')?.remove()});
go('首頁總覽');

<script>
// 本機預覽版家庭關係：以信眾 ID 建立雙向關聯，不修改其他模組資料結構。
const oldOpenEditor=openEditor;
const oldRenderRows=renderRows;
const oldDeleteRecord=deleteRecord;
const familyTypes=['配偶','父母','子女','兄弟姊妹','祖父母','孫子女','其他親屬','其他'];
const inverseType={'配偶':'配偶','父母':'子女','子女':'父母','兄弟姊妹':'兄弟姊妹','祖父母':'孫子女','孫子女':'祖父母','其他親屬':'其他親屬','其他':'其他'};
function familyName(id){return db['信眾管理'].find(x=>x._id===id)?.['姓名']||'已移除的信眾'}
function familyLinks(id){return db['信眾管理'].find(x=>x._id===id)?._relations||[]}
function relationText(id){return familyLinks(id).map(x=>`${familyName(x.id)}（${x.type}）`).join('、')||'尚未設定'}
renderRows = function(name,q=''){
 if(name!=='信眾管理')return oldRenderRows(name,q);
 const fields=fieldMap[name],filtered=db[name].filter(r=>[...fields.map(k=>r[k]),relationText(r._id)].some(v=>String(v||'').toLowerCase().includes(q.toLowerCase())));
 document.getElementById('rows').innerHTML=filtered.map(r=>`<tr>${fields.map(k=>`<td>${displayVal(k,r[k])}</td>`).join('')}<td>${familyLinks(r._id).length?familyLinks(r._id).map(link=>`<div><button class="family-link" onclick="openEditor('信眾管理','${link.id}')">${esc(familyName(link.id))}</button><span class="family-small">（${esc(link.type)}）</span></div>`).join(''):'<span class="family-small">未設定</span>'}</td><td style="white-space:nowrap"><button class="secondary tiny" onclick="openEditor('信眾管理','${r._id}')">編輯</button> <button class="secondary tiny danger" onclick="deleteRecord('信眾管理','${r._id}')">刪除</button></td></tr>`).join('')||`<tr><td colspan="${fields.length+2}" style="text-align:center;padding:35px">沒有符合資料</td></tr>`;
 document.getElementById('count').textContent=`共 ${filtered.length} 筆資料（本機示範資料）`;
}
const oldModulePage=modulePage;
modulePage = function(name){oldModulePage(name);if(name==='信眾管理'){
 const th=document.querySelector('#content thead tr');if(th){const cell=document.createElement('th');cell.textContent='關聯信眾';th.insertBefore(cell,th.lastElementChild)}
 const hint=document.createElement('div');hint.className='family-info';hint.textContent='家庭關係可綁定夫妻、父母、子女等。點選關聯姓名即可開啟對方資料；雙方會同步顯示關係。';document.querySelector('.datawrap .filters')?.after(hint);
 renderRows(name,document.getElementById('filter')?.value||'');
}}
openEditor = function(name,id){oldOpenEditor(name,id);if(name!=='信眾管理')return;
 const record=id?db[name].find(x=>x._id===id):null;
 const form=document.getElementById('recordForm');if(!form)return;
 const block=document.createElement('div');block.className='family-editor';block.innerHTML=`<h3>家庭關係綁定</h3><div class="family-small">搜尋或選擇其他已建立的信眾，並指定關係。儲存後會同步建立雙向關聯。</div><div id="familySelected"></div><div class="family-row"><select id="familyTarget"><option value="">選擇關聯信眾</option>${db[name].filter(x=>x._id!==id).map(x=>`<option value="${esc(x._id)}">${esc(x['姓名'])}｜${esc(x['電話']||'無電話')}</option>`).join('')}</select><select id="familyType">${familyTypes.map(t=>`<option value="${t}">${t}</option>`).join('')}</select><button class="secondary" type="button" id="familyAdd">＋ 加入</button></div><div class="family-small">如對方尚未建檔，請先儲存這位信眾，再新增對方並建立關聯。</div>`;
 form.querySelector('.modalActions').before(block);
 let links=(record?familyLinks(record._id):[]).map(x=>({...x}));
 function draw(){document.getElementById('familySelected').innerHTML=links.length?links.map((x,i)=>`<span class="family-chip">${esc(familyName(x.id))} · ${esc(x.type)} <button type="button" class="secondary tiny" data-remove="${i}">解除</button></span>`).join(''):'<div class="family-small">目前沒有關聯信眾</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{links.splice(Number(b.dataset.remove),1);draw()})}
 draw();document.getElementById('familyAdd').onclick=()=>{const target=document.getElementById('familyTarget').value;const type=document.getElementById('familyType').value;if(!target)return alert('請先選擇信眾');if(links.some(x=>x.id===target))return alert('已經加入這位信眾');links.push({id:target,type});draw()};
 const originalSubmit=form.onsubmit;
 form.onsubmit=e=>{const oldIds=new Set(record?familyLinks(record._id).map(x=>x.id):[]);const before=new Set(db[name].map(x=>x._id));originalSubmit(e);const me=record?db[name].find(x=>x._id===record._id):db[name].find(x=>!before.has(x._id));if(!me)return;me._relations=links;for(const other of db[name]){if(other._id===me._id)continue;other._relations=(other._relations||[]).filter(x=>x.id!==me._id);const link=links.find(x=>x.id===other._id);if(link)other._relations.push({id:me._id,type:inverseType[link.type]||'其他'});}persist();if(current==='信眾管理')modulePage('信眾管理')};
}
deleteRecord = function(name,id){if(name!=='信眾管理')return oldDeleteRecord(name,id);if(!confirm('確定刪除此信眾？其家庭關聯也會解除，但其他信眾資料會保留。'))return;db[name]=db[name].filter(x=>x._id!==id);db[name].forEach(x=>x._relations=(x._relations||[]).filter(y=>y.id!==id));persist();modulePage(name)}
</script>

<script>
// This offline demo stores relational links in browser storage only, not in a server database.
const rosterKey='sanxun-activity-roster-v1';
let rosters={};try{rosters=JSON.parse(localStorage.getItem(rosterKey)||'{}')}catch(e){}

function activityById(id){return db['活動管理'].find(a=>a._id===id)}
function roster(id){return rosters[id]||(rosters[id]=[])}
function personById(id){return db['信眾管理'].find(p=>p._id===id)}
function amount(r){return (r.payments||[]).reduce((n,p)=>n+money(p.amount),0)}
function due(r){return (r.rituals||[]).reduce((n,p)=>n+money(p.price),0)}
function activityStats(id){const rs=roster(id);return {n:rs.length,d:rs.reduce((n,r)=>n+due(r),0),p:rs.reduce((n,r)=>n+amount(r),0)}}
const originalModulePageLinked=modulePage;
modulePage=function(name){originalModulePageLinked(name);if(name==='活動管理'){
 document.querySelectorAll('#rows tr').forEach((tr,i)=>{const a=db['活動管理'].filter(r=>fieldMap[name].some(k=>String(r[k]||'').toLowerCase().includes((document.getElementById('filter')?.value||'').toLowerCase())))[i];if(!a)return;const cell=tr.querySelector('td');if(cell){cell.innerHTML=`<button class="link" onclick="showActivity('${a._id}')">${esc(a['活動名稱']||'未命名活動')}</button><div class="mini">點選進入報名名冊</div>`;}const ops=tr.lastElementChild;if(ops){ops.insertAdjacentHTML('afterbegin',`<button class="secondary tiny" onclick="showActivity('${a._id}')">參加名單</button> `)}});
 document.querySelector('#filter')?.addEventListener('input',()=>setTimeout(()=>modulePage('活動管理'),0),{once:true});
 }if(name==='參與紀錄'){const wrap=document.querySelector('.datawrap');if(wrap){wrap.insertAdjacentHTML('afterbegin',`<p class="mini">下方為信眾即時活動關聯索引，點姓名可查看其活動、儀式與繳費明細。</p><div id="liveParticipation"></div>`);document.getElementById('liveParticipation').innerHTML=`<div class="roster-table"><table><thead><tr><th>信眾</th><th>參加活動數</th><th>儀式項目數</th><th>活動已繳費</th><th>操作</th></tr></thead><tbody>${db['信眾管理'].map(p=>{let rec=Object.values(rosters).flat().filter(r=>r.personId===p._id);return `<tr><td>${esc(p['姓名'])}</td><td>${rec.length}</td><td>${rec.reduce((n,r)=>n+(r.rituals||[]).length,0)}</td><td>${fmt(rec.reduce((n,r)=>n+amount(r),0))}</td><td><button class="link" onclick="showPerson('${p._id}')">查看紀錄</button></td></tr>`}).join('')}</tbody></table></div>`}}};
const originalRenderRowsLinked=renderRows;
renderRows=function(name,q=''){originalRenderRowsLinked(name,q);if(name==='活動管理'){const matches=db[name].filter(r=>fieldMap[name].some(k=>String(r[k]||'').toLowerCase().includes(q.toLowerCase())));document.querySelectorAll('#rows tr').forEach((tr,i)=>{const a=matches[i];if(!a)return;const td=tr.querySelector('td');if(td)td.innerHTML=`<button class="link" onclick="showActivity('${a._id}')">${esc(a['活動名稱']||'未命名活動')}</button>`;tr.lastElementChild?.insertAdjacentHTML('afterbegin',`<button class="secondary tiny" onclick="showActivity('${a._id}')">名單</button> `)})}};
function showActivity(id,q=''){const a=activityById(id);if(!a){go('活動管理');return}window.activeActivity=id;const rs=roster(id),st=activityStats(id);document.getElementById('content').innerHTML=`<div class="moduleHead"><div><button class="link" onclick="go('活動管理')">← 返回活動管理</button><h1 style="margin-top:12px">${esc(a['活動名稱']||'活動詳情')}</h1><p>${esc(a['活動日期']||'未設定日期')} · ${esc(a['地點']||'彰化三巡府')} · ${esc(a['狀態']||'')}</p></div><button class="primary" onclick="openSignup('${id}')">＋ 新增報名</button></div><div class="roster-summary"><div>報名人數<b>${st.n}</b></div><div>應收費用<b>${fmt(st.d)}</b></div><div>已收費用<b>${fmt(st.p)}</b></div><div>未收費用<b>${fmt(st.d-st.p)}</b></div></div><section class="detail-panel"><h3>活動參加名冊</h3><div class="rosterbar"><input id="rosterSearch" value="${esc(q)}" placeholder="搜尋姓名、電話、儀式" oninput="filterRoster()"><button class="secondary" onclick="exportRoster('${id}')">↓ 匯出名冊 CSV</button><span class="mini">每位參加者連結到既有信眾資料</span></div><div class="roster-table"><table><thead><tr><th>信眾姓名</th><th>電話</th><th>儀式項目</th><th>應收</th><th>已收</th><th>未收</th><th>操作</th></tr></thead><tbody id="rosterRows"></tbody></table></div></section><div class="notice">本機測試版：請只用虛構資料測試。活動款項不會自動建立另一筆財務收入，以避免重複計帳；正式版須再串接收款帳本。</div>`;filterRoster()}
function filterRoster(){const q=(document.getElementById('rosterSearch')?.value||'').toLowerCase();const rs=roster(window.activeActivity).filter(r=>{const p=personById(r.personId);return [p?.姓名,p?.電話,...(r.rituals||[]).map(x=>x.name)].join(' ').toLowerCase().includes(q)});document.getElementById('rosterRows').innerHTML=rs.map(r=>{const p=personById(r.personId),paid=amount(r),d=due(r);return `<tr><td><button class="link" onclick="showPerson('${r.personId}')">${esc(p?.姓名||'已刪除信眾')}</button></td><td>${esc(p?.電話||'—')}</td><td>${esc((r.rituals||[]).map(x=>x.name).join('、')||'未選擇')}</td><td>${fmt(d)}</td><td class="statusok">${fmt(paid)}</td><td class="${d>paid?'statusdue':'statusok'}">${fmt(d-paid)}</td><td style="white-space:nowrap"><button class="secondary tiny" onclick="openSignup('${window.activeActivity}','${r.id}')">編輯</button> <button class="secondary tiny" onclick="openPayment('${window.activeActivity}','${r.id}')">收款</button> <button class="secondary tiny danger" onclick="removeSignup('${window.activeActivity}','${r.id}')">移除</button></td></tr>`}).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px">目前沒有符合的報名紀錄</td></tr>'}
function openSignup(aid,rid){const r=roster(aid).find(x=>x.id===rid);const people=db['信眾管理'];if(!people.length)return alert('請先在信眾管理新增信眾');document.getElementById('editOverlay')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modalBackdrop" id="editOverlay"><div class="modalBox large"><h2>${r?'修改報名':'新增活動報名'}</h2><form id="signupForm"><div class="form-inline"><label>選擇信眾<select id="signupPerson" required>${people.map(p=>`<option value="${esc(p._id)}" ${r?.personId===p._id?'selected':''}>${esc(p['姓名'])}｜${esc(p['電話']||'')}</option>`).join('')}</select></label><label>報名備註<input id="signupNote" value="${esc(r?.note||'')}" placeholder="選填"></label></div><h3>辦理儀式及費用</h3><div id="ritualLines"></div><button type="button" class="secondary" onclick="addRitualLine()">＋ 增加儀式</button><div class="modalActions"><button type="button" class="secondary" onclick="document.getElementById('editOverlay').remove()">取消</button><button class="primary" type="submit">儲存報名</button></div></form></div></div>`);(r?.rituals?.length?r.rituals:[{name:'祝壽',price:500}]).forEach(x=>addRitualLine(x.name,x.price));document.getElementById('signupForm').onsubmit=e=>{e.preventDefault();const personId=document.getElementById('signupPerson').value;if(roster(aid).some(x=>x.personId===personId&&x.id!==rid))return alert('這位信眾已報名此活動，請直接編輯原紀錄');const lines=[...document.querySelectorAll('.ritualLine')].map(el=>({name:el.querySelector('.rname').value.trim(),price:Math.max(0,money(el.querySelector('.rprice').value))})).filter(x=>x.name);if(!lines.length)return alert('至少填寫一個儀式項目');const record={id:r?.id||newId(),personId,rituals:lines,payments:r?.payments||[],note:document.getElementById('signupNote').value};if(r)Object.assign(r,record);else roster(aid).push(record);saveRosters();document.getElementById('editOverlay').remove();showActivity(aid)}}
function addRitualLine(name='',price=0){const el=document.createElement('div');el.className='ritualLine';el.style='display:flex;gap:8px;margin:9px 0';el.innerHTML=`<input class="rname" style="flex:2;min-width:0;padding:10px;border:1px solid #dbe6e4;border-radius:8px" placeholder="儀式名稱（如補運、點燈）" value="${esc(name)}"><input class="rprice" style="flex:1;min-width:0;padding:10px;border:1px solid #dbe6e4;border-radius:8px" type="number" min="0" placeholder="費用" value="${Number(price)||0}"><button type="button" class="secondary tiny" onclick="this.parentElement.remove()">移除</button>`;document.getElementById('ritualLines').appendChild(el)}
function openPayment(aid,rid){const r=roster(aid).find(x=>x.id===rid);if(!r)return;const remain=due(r)-amount(r);document.getElementById('editOverlay')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modalBackdrop" id="editOverlay"><div class="modalBox"><h2>登記活動收款</h2><p>信眾：${esc(personById(r.personId)?.姓名||'—')}</p><p>應收 ${fmt(due(r))}／已收 ${fmt(amount(r))}／未收 ${fmt(remain)}</p><form id="paymentForm"><div class="form-inline"><label>本次收款金額<input id="payAmount" type="number" min="1" max="${Math.max(0,remain)}" value="${Math.max(0,remain)}" required></label><label>收款方式<select id="payMethod"><option>現金</option><option>轉帳</option><option>其他</option></select></label></div><div class="modalActions"><button type="button" class="secondary" onclick="document.getElementById('editOverlay').remove()">取消</button><button class="primary" type="submit">確認收款</button></div></form><h3>歷史收款</h3>${(r.payments||[]).map((p,i)=>`<div class="todo">${esc(p.date)} ${fmt(money(p.amount))} ${esc(p.method)} <button class="secondary tiny danger" style="margin-left:auto" onclick="removePayment('${aid}','${rid}',${i})">撤銷</button></div>`).join('')||'<p class="mini">尚無收款紀錄</p>'}</div></div>`);document.getElementById('paymentForm').onsubmit=e=>{e.preventDefault();const val=money(document.getElementById('payAmount').value);if(val<=0||val>due(r)-amount(r))return alert('金額必須大於零且不得超過未收款');r.payments.push({amount:val,method:document.getElementById('payMethod').value,date:new Date().toISOString().slice(0,10)});saveRosters();document.getElementById('editOverlay').remove();showActivity(aid)}}
function removePayment(aid,rid,i){if(!confirm('確認撤銷這筆示範收款？'))return;roster(aid).find(r=>r.id===rid)?.payments.splice(i,1);saveRosters();document.getElementById('editOverlay').remove();showActivity(aid)}
function removeSignup(aid,rid){if(!confirm('確定移除這筆報名與其示範收款紀錄？'))return;rosters[aid]=roster(aid).filter(x=>x.id!==rid);saveRosters();showActivity(aid)}
function showPerson(pid){const p=personById(pid);if(!p)return alert('此信眾已刪除');const records=Object.entries(rosters).flatMap(([aid,rs])=>rs.filter(r=>r.personId===pid).map(r=>({a:activityById(aid),r})));document.getElementById('content').innerHTML=`<div class="moduleHead"><div><button class="link" onclick="showActivity(window.activeActivity||'${db['活動管理'][0]?._id||''}')">← 返回活動名冊</button><h1 style="margin-top:14px">${esc(p['姓名'])}｜信眾個人檔案</h1><p>家庭關係：${esc(typeof relationText==='function'?relationText(pid):'—')}</p></div><button class="primary" onclick="openEditor('信眾管理','${pid}')">編輯信眾基本資料</button></div><div class="detail-panel"><h3>基本資料</h3><div class="form-inline">${['姓名','性別','電話','地址','國曆生日','農曆生日','出生時辰','備註'].map(k=>`<div><span class="mini">${k}</span><div>${esc(p[k]||'—')}</div></div>`).join('')}</div></div><div class="detail-panel"><h3>活動參與、儀式與繳費紀錄</h3><div class="roster-table"><table><thead><tr><th>活動</th><th>儀式</th><th>應收</th><th>已繳</th><th>未繳</th></tr></thead><tbody>${records.map(({a,r})=>`<tr><td><button class="link" onclick="showActivity('${a?._id||''}')">${esc(a?.['活動名稱']||'已刪除活動')}</button></td><td>${esc(r.rituals.map(x=>x.name).join('、'))}</td><td>${fmt(due(r))}</td><td>${fmt(amount(r))}</td><td>${fmt(due(r)-amount(r))}</td></tr>`).join('')||'<tr><td colspan="5">尚無活動參與紀錄</td></tr>'}</tbody></table></div></div>`}
function exportRoster(aid){const lines=[['姓名','電話','儀式','應收','已繳','未繳'],...roster(aid).map(r=>{const p=personById(r.personId);return [p?.姓名||'',p?.電話||'',r.rituals.map(x=>x.name).join('、'),due(r),amount(r),due(r)-amount(r)]})];const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='活動名冊-'+(activityById(aid)?.['活動名稱']||'活動')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
// Sample linked data is seeded once. Existing browser data is never overwritten.
if(!localStorage.getItem('sanxun-roster-seeded-v1')){const a=db['活動管理'][0],people=db['信眾管理'];if(a&&people.length){const rs=roster(a._id);if(!rs.length){rs.push({id:newId(),personId:people[0]._id,rituals:[{name:'祝壽',price:500},{name:'補運',price:700}],payments:[{amount:500,method:'現金',date:'2026-10-15'}],note:'示範報名'});if(people[1])rs.push({id:newId(),personId:people[1]._id,rituals:[{name:'祝壽',price:500}],payments:[{amount:500,method:'轉帳',date:'2026-10-15'}],note:'示範報名'})}saveRosters()}localStorage.setItem('sanxun-roster-seeded-v1','1')}
</script>

<script>
/* 活動公開報名與審核：本機示範 + 雲端 PostgreSQL API */
const publicSubmissionKey='sanxun-public-submissions-v1';
let publicSubmissions=[];
try{publicSubmissions=JSON.parse(localStorage.getItem(publicSubmissionKey)||'[]')}catch{}
const regEsc=v=>esc(String(v??''));
function publicSave(){localStorage.setItem(publicSubmissionKey,JSON.stringify(publicSubmissions))}
function registrationUrl(id){return location.href.split('#')[0].split('?')[0]+'?register='+encodeURIComponent(id)}
function shareEvent(id){
 const a=activityById(id);if(!a)return;
 const box=document.getElementById('shareArea');if(!box)return;
 box.innerHTML=`<div class="sharebox"><b>活動線上報名</b><p class="mini">產生報名網址後可傳 LINE。只有部署至公開伺服器且連接 PostgreSQL，外部報名才會同步；本機 file:// 網址不能分享給別人使用。</p><input id="shareLink" readonly value="${regEsc(registrationUrl(id))}"><div class="shareactions"><button class="secondary" onclick="navigator.clipboard?.writeText(document.getElementById('shareLink').value).then(()=>alert('已複製網址')).catch(()=>prompt('請複製網址',document.getElementById('shareLink').value))">複製網址</button><button class="secondary" onclick="location.href=registrationUrl('${id}')">預覽報名頁</button><button class="secondary" onclick="syncEvent('${id}')">同步活動到雲端</button><button class="primary" onclick="loadPublicEntries('${id}')">更新線上報名名冊</button></div></div>`;
}
const showActivityBeforePublic=showActivity;
showActivity=function(id,q=''){showActivityBeforePublic(id,q);const panel=document.querySelector('.detail-panel');if(panel){panel.insertAdjacentHTML('beforebegin',`<div id="shareArea"></div><div id="publicEntries"></div>`);shareEvent(id);renderPublicEntries(id)}};
function matchPeople(entry){return db['信眾管理'].filter(p=>((p['姓名']||'').trim()===entry.name.trim())||((p['電話']||'').replace(/\D/g,'')&& (p['電話']||'').replace(/\D/g,'')===entry.phone.replace(/\D/g,'')))}
function renderPublicEntries(aid){
 const el=document.getElementById('publicEntries');if(!el)return;
 const entries=publicSubmissions.filter(e=>e.eventId===aid);
 el.innerHTML=`<section class="detail-panel"><h3>線上報名待審核 (${entries.filter(e=>e.status!=='approved').length})</h3><p class="mini">新報名先進待確認區，不會自動覆蓋既有信眾。依姓名／電話找可能的信眾，由管理員確認後綁定。</p><div class="roster-table"><table><thead><tr><th>報名者</th><th>儀式與金額</th><th>辨識結果</th><th>操作</th></tr></thead><tbody>${entries.map(e=>{const matches=matchPeople(e);return `<tr><td>${regEsc(e.name)}<div class="mini">${regEsc(e.phone)}</div></td><td>${(e.rituals||[]).map(r=>regEsc(r.name)+' '+fmt(r.price)).join('、')}<div class="mini">合計 ${fmt((e.rituals||[]).reduce((n,r)=>n+Number(r.price||0),0))}</div></td><td><span class="matchpill">${e.status==='approved'?'已審核':matches.length?'疑似既有信眾 '+matches.length+' 筆':'新報名者'}</span></td><td>${e.status==='approved'?'已匯入':`<button class="secondary tiny" onclick="reviewEntry('${regEsc(e.id)}')">比對／匯入</button>`}</td></tr>`}).join('')||'<tr><td colspan="4">尚無線上報名</td></tr>'}</tbody></table></div></section>`;
}
function reviewEntry(id){
 const e=publicSubmissions.find(x=>x.id===id);if(!e)return;
 const matches=matchPeople(e);
 const options=['0｜先只保留報名，不建立信眾',...db['信眾管理'].map((p,i)=>`${i+1}｜${p['姓名']} ${p['電話']||''}`),'N｜建立新信眾'];
 const hint=matches.length?'可能符合：'+matches.map(p=>p['姓名']+' '+(p['電話']||'')).join('、'):'找不到明顯符合的信眾';
 const val=prompt(hint+'\n輸入現有信眾的序號，或 N 建立新信眾：\n'+options.join('\n'),'');
 if(val===null||val==='0'||val==='')return;
 let person;
 if(val.toUpperCase()==='N'){
   person={_id:newId(),'姓名':e.name,'電話':e.phone,'國曆生日':e.birthday||'','地址':e.address||'','備註':'由線上報名新增（請核對身分）'};
   db['信眾管理'].push(person);persist();
 }else{const i=Number(val)-1;person=db['信眾管理'][i];if(!person)return alert('選擇的序號無效')}
 const rs=roster(e.eventId);
 if(rs.some(r=>r.personId===person._id)){if(!confirm('這位信眾已在活動名冊，是否保留原報名並標記已審核？'))return}
 else{rs.push({id:newId(),personId:person._id,rituals:e.rituals||[],payments:[],note:'線上報名｜'+(e.note||'')});saveRosters()}
 e.status='approved';e.personId=person._id;publicSave();showActivity(e.eventId);
}
function publicEventForm(aid){
 const a=activityById(aid);
 document.getElementById('side').style.display='none';document.querySelector('.top').style.display='none';document.querySelector('.workspace').style.marginLeft='0';
 document.getElementById('content').innerHTML=`<div class="publicwrap"><div style="text-align:center"><img src="temple-logo.png" style="height:76px;object-fit:contain"><h1>彰化三巡府</h1><h2>${regEsc(a?.['活動名稱']||'活動線上報名')}</h2><p>${regEsc(a?.['活動日期']||'')}｜${regEsc(a?.['地點']||'彰化三巡府')}</p></div><form id="publicForm"><label>報名人姓名 *<input name="name" required maxlength="80"></label><label>電話 *<input name="phone" required maxlength="30"></label><label>國曆生日<input name="birthday" type="date"></label><label>地址<input name="address" maxlength="250"></label><label>參加儀式（可複選）</label><div id="publicRituals"></div><button type="button" class="secondary" onclick="addPublicRitual()">＋ 新增儀式</button><label>備註<textarea name="note" rows="2" maxlength="500"></textarea></label><label class="checkline"><input type="checkbox" required> 我已閱讀並同意本活動資料僅供報名聯繫、名冊與費用管理使用（正式上線須提供完整個資告知事項）</label><p id="publicTotal"></p><button class="primary" type="submit">送出報名</button></form><p class="mini">本機版僅示範流程，只有正式部署的網址才能跨裝置提交。</p></div>`;
 addPublicRitual();
 document.getElementById('publicForm').onsubmit=submitPublic;
}
function addPublicRitual(){const el=document.getElementById('publicRituals');el.insertAdjacentHTML('beforeend',`<div class="form-inline publicRitual"><label>儀式<select class="prname"><option>祝壽</option><option>補運</option><option>安太歲</option><option>光明燈</option><option>消災祈福</option><option>迴向</option><option>其他</option></select></label><label>費用<input class="prprice" type="number" min="0" value="500" required></label><button type="button" class="secondary tiny" onclick="this.closest('.publicRitual').remove();calcPublic()">移除</button></div>`);el.querySelectorAll('input,select').forEach(x=>x.oninput=calcPublic);calcPublic()}
function calcPublic(){const v=[...document.querySelectorAll('.prprice')].reduce((n,x)=>n+Math.max(0,Number(x.value)||0),0);const el=document.getElementById('publicTotal');if(el)el.textContent='應繳金額：'+fmt(v)+'（尚未收款）'}
async function submitPublic(ev){
 ev.preventDefault();const form=ev.target;const f=new FormData(form);
 const aid=new URLSearchParams(location.search).get('register');
 const entry={id:'online-'+newId(),eventId:aid,name:String(f.get('name')||'').trim(),phone:String(f.get('phone')||'').trim(),birthday:String(f.get('birthday')||''),address:String(f.get('address')||''),note:String(f.get('note')||''),rituals:[...document.querySelectorAll('.publicRitual')].map(x=>({name:x.querySelector('.prname').value,price:Number(x.querySelector('.prprice').value)||0})),status:'pending',createdAt:new Date().toISOString()};
 if(!entry.name||!entry.phone||!entry.rituals.length)return alert('請填寫姓名、電話及儀式');
 try{
   if(location.protocol.startsWith('http')){
     const res=await fetch('/api/public/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)});
     const data=await res.json();if(!res.ok)throw Error(data.error||'送出失敗');
   }else{publicSubmissions.push(entry);publicSave()}
   document.getElementById('content').innerHTML=`<div class="publicwrap" style="text-align:center"><h1>✓ 報名資料已送出</h1><p>${regEsc(entry.name)}，謝謝您的報名。</p><p class="mini">${location.protocol==='file:'?'本機測試：只儲存在同一個瀏覽器，不會傳到宮廟。':'已送交宮廟，等待管理員確認。'}</p><button class="secondary" onclick="location.href=location.pathname">返回首頁</button></div>`;
 }catch(err){alert('送出失敗：'+err.message)}
}
async function adminToken(){
 let t=sessionStorage.getItem('sanxun-online-token');
 if(t)return t;
 const email=prompt('請輸入管理員 Email');if(!email)return null;
 const password=prompt('請輸入管理員密碼');if(!password)return null;
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
 if(!r.ok)throw Error('登入失敗，請確認 Railway 的管理員帳密');
 t=(await r.json()).token;sessionStorage.setItem('sanxun-online-token',t);return t;
}
async function syncEvent(id){
 if(location.protocol==='file:')return alert('請先將此版部署到 Railway，才能建立可分享的線上活動。');
 try{const t=await adminToken();if(!t)return;const a=activityById(id);const r=await fetch('/api/admin/event',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({id,name:a['活動名稱'],date:a['活動日期'],place:a['地點'],status:a['狀態']})});if(!r.ok)throw Error((await r.json()).error||'同步失敗');alert('活動已同步，現在可以分享報名網址')}catch(e){alert(e.message)}
}
async function loadPublicEntries(id){
 if(location.protocol==='file:'){renderPublicEntries(id);return alert('本機只能看到本機示範送出的報名。跨裝置需要 Railway。')}
 try{const t=await adminToken();if(!t)return;const r=await fetch('/api/admin/submissions?eventId='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw Error((await r.json()).error||'載入失敗');const list=await r.json();for(const item of list){const i=publicSubmissions.findIndex(x=>x.id===item.id);if(i<0)publicSubmissions.push(item);else if(publicSubmissions[i].status!=='approved')publicSubmissions[i]=item}publicSave();renderPublicEntries(id)}catch(e){alert(e.message)}
}
const registerId=new URLSearchParams(location.search).get('register');

  }));
  db['功德箱管理'].filter(r=>r['信眾ID']===id||r['捐款人']===p['姓名']).forEach(r=>entries.push({date:r['捐款日期']||'',type:'功德捐款',name:r['捐款項目']||'功德箱',fee:money(r['金額']),paid:money(r['金額']),details:r['收據編號']||''}));
  db['儀式管理'].filter(r=>r['信眾ID']===id||r['信眾']===p['姓名']).forEach(r=>entries.push({date:r['辦理日期']||'',type:'儀式登記',name:r['儀式項目']||'儀式',fee:money(r['費用']),paid:null,details:r['狀態']||'未確認收款'}));
  entries.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const content=document.querySelector('#content .datawrap');if(!content)return;
  content.innerHTML='<h3>📋 '+esc(p['姓名'])+'｜歷史參與與繳費明細</h3><div class="sanxun-ledger-note">依日期查看這位信眾參加過的活動、捐款、儀式與繳費情況。活動費與功德捐款分開記帳；儀式若未連結收款，不會假設已繳清。</div><div class="tableScroll"><table><thead><tr><th>日期</th><th>類別</th><th>活動／項目</th><th>內容</th><th>應收／金額</th><th>已收</th><th>未收</th></tr></thead><tbody>'+(entries.map(e=>'<tr><td>'+esc(e.date||'—')+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.name)+'</td><td>'+esc(e.details||'—')+'</td><td>'+fmt(e.fee)+'</td><td>'+(e.paid===null?'待核對':fmt(e.paid))+'</td><td>'+(e.paid===null?'待核對':fmt(Math.max(0,e.fee-e.paid)))+'</td></tr>').join('')||'<tr><td colspan="7" style="text-align:center;padding:25px">目前尚無歷史參與或繳費紀錄</td></tr>')+'</tbody></table></div>';
  const tabs=document.querySelector('.profile-tabs');if(tabs){tabs.innerHTML='<button class="on" onclick="sanxunProfile(\''+id+'\')">收支與參與歷史</button>'+['功德捐款','儀式紀錄','關懷追蹤','基本資料'].map(t=>'<button onclick="sanxunProfile(\''+id+'\',\''+t+'\')">'+t+'</button>').join('')}
  const heading=document.querySelector('.moduleHead h1');if(heading)heading.textContent='👤 '+p['姓名']+'｜個人歷史紀錄';
 };
 if(current==='信眾管理')cleanRoster();
})();
</script>

<style>
.sx-birthday{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#a51e4d;background:#ffe3eb;border:1px solid #ee9eb8;padding:7px 10px;border-radius:10px}
.sx-unpaid{display:inline-block;background:#fff0d6;color:#9a4900;border:1px solid #e9bd6d;border-radius:9px;padding:7px 10px;font-weight:800}
.sx-ok{color:#08785b;font-weight:700}.sx-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style>
<script>
(function(){
const baseRender=renderRows;
function monthDay(v){const m=String(v||'').match(/(?:\d{4}[-\/])?(\d{1,2})[-\/](\d{1,2})/);return m?{m:+m[1],d:+m[2]}:null}
function birthday(p){const b=monthDay(p['國曆生日']),now=new Date();if(!b||b.m!==now.getMonth()+1)return '';return '<span class="sx-birthday">🎂 '+(b.d===now.getDate()?'今天生日！':'本月壽星 '+b.m+'/'+b.d)+'</span>'}
function activityEntries(p){return Object.entries(rosters).flatMap(([aid,rs])=>rs.filter(r=>r.personId===p._id).map(r=>({aid,r,a:activityById(aid)})))}
function owed(p){return activityEntries(p).reduce((n,{r})=>n+Math.max(0,due(r)-amount(r)),0)}
function redraw(q=''){
if(current!=='信眾管理')return;const body=document.getElementById('rows');if(!body)return;
const table=body.closest('table');table.classList.add('sanxun-clean-table');
table.querySelector('thead').innerHTML='<tr><th>信眾</th><th>電話</th><th>國曆生日</th><th>家庭關係</th><th>參與與繳費狀態</th><th>個人歷史</th><th>操作</th></tr>';
const people=db['信眾管理'].filter(p=>[...fieldMap['信眾管理'].map(k=>p[k]),relationText(p._id)].some(v=>String(v||'').toLowerCase().includes(q.toLowerCase())));
body.innerHTML=people.map(p=>{
const rel=(p._relations||[]).map(r=>'<button class="family-link" onclick="openEditor(\'信眾管理\',\''+r.id+'\')">'+esc(familyName(r.id))+'</button> ('+esc(r.type)+')').join('、')||'—';
const b=monthDay(p['國曆生日']),sum=owed(p);
return '<tr><td><b>'+birthday(p)+' '+esc(p['姓名']||'—')+'</b></td><td>'+esc(p['電話']||'—')+'</td><td>'+(b?b.m+'/'+b.d:'—')+'</td><td>'+rel+'</td><td>'+(sum>0?'<span class="sx-unpaid">⚠ 尚有未收款 '+fmt(sum)+'</span>':'<span class="sx-ok">無已知未收活動款</span>')+'</td><td><button class="profile-action" onclick="sanxunProfile(\''+p._id+'\')">📋 參與／收款歷史</button></td><td><button class="secondary tiny" onclick="openEditor(\'信眾管理\',\''+p._id+'\')">編輯</button> <button class="secondary tiny danger" onclick="deleteRecord(\'信眾管理\',\''+p._id+'\')">刪除</button></td></tr>'
}).join('')||'<tr><td colspan="7">沒有符合的信眾</td></tr>';
const c=document.getElementById('count');if(c)c.textContent='共 '+people.length+' 筆信眾資料';
}
renderRows=function(name,q=''){baseRender(name,q);if(name==='信眾管理')redraw(q)};
const previousPage=modulePage;modulePage=function(name){previousPage(name);if(name==='信眾管理')redraw(document.getElementById('filter')?.value||'')};
window.sanxunProfile=function(id,tab='全部歷史'){
const p=db['信眾管理'].find(x=>x._id===id);if(!p)return;
const activities=activityEntries(p),donations=db['功德箱管理'].filter(x=>x['信眾ID']===id||x['捐款人']===p['姓名']),rituals=db['儀式管理'].filter(x=>x['信眾ID']===id||x['信眾']===p['姓名']);
const finances=db['財務管理'].filter(x=>x['信眾ID']===id||x['信眾']===p['姓名']||String(x['摘要']||'').includes(p['姓名']));
const rows=[
...activities.map(({a,r,aid})=>({date:a?.['活動日期']||'',kind:'活動參與',item:a?.['活動名稱']||'已刪除活動',detail:(r.rituals||[]).map(x=>x.name).join('、'),due:due(r),paid:amount(r),aid})),
...donations.map(x=>({date:x['捐款日期']||'',kind:'功德捐款',item:x['捐款項目']||'功德箱',detail:x['收據編號']||'',due:money(x['金額']),paid:money(x['金額'])})),
...rituals.map(x=>({date:x['辦理日期']||'',kind:'儀式登記',item:x['儀式項目']||'',detail:x['狀態']||'',due:money(x['費用']),paid:null})),
...finances.map(x=>({date:x['日期']||'',kind:'財務紀錄',item:x['摘要']||x['分類']||'',detail:x['收支類型']||'',due:money(x['金額']),paid:x['收支類型']==='收入'?money(x['金額']):null}))
].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
const filtered=tab==='全部歷史'?rows:rows.filter(x=>x.kind===tab);
const tabs=['全部歷史','活動參與','功德捐款','儀式登記','財務紀錄'];
const table='<div class="tableScroll"><table><thead><tr><th>日期</th><th>來源</th><th>活動／項目</th><th>內容</th><th>應收／金額</th><th>已收</th><th>狀態</th><th>操作</th></tr></thead><tbody>'+ (filtered.map(x=>{const remain=x.paid===null?null:Math.max(0,x.due-x.paid);return '<tr><td>'+esc(x.date||'—')+'</td><td>'+esc(x.kind)+'</td><td>'+esc(x.item)+'</td><td>'+esc(x.detail||'—')+'</td><td>'+fmt(x.due)+'</td><td>'+(x.paid===null?'待核對':fmt(x.paid))+'</td><td>'+(remain===null?'待核對':remain>0?'<span class="sx-unpaid">未收款 '+fmt(remain)+'</span>':'<span class="sx-ok">已收／無欠款</span>')+'</td><td>'+(x.aid?'<button class="secondary tiny" onclick="showActivity(\''+x.aid+'\')">活動名冊／收款</button>':'<button class="secondary tiny" onclick="go(\'財務管理\')">財務管理</button>')+'</td></tr>'}).join('')||'<tr><td colspan="8">目前沒有此類紀錄</td></tr>')+'</tbody></table></div>';
document.getElementById('content').innerHTML='<div class="moduleHead"><div><button class="secondary" onclick="go(\'信眾管理\')">← 返回信眾管理</button><h1 style="margin-top:12px">'+esc(p['姓名'])+'｜個人參與及收款歷史</h1><p>自動彙整活動名冊、功德箱、儀式與已登錄財務資料</p></div><button class="primary" onclick="go(\'財務管理\')">查看財務管理 →</button></div><div class="profile-metrics"><div>參加活動<strong>'+activities.length+' 次</strong></div><div>活動已收<strong>'+fmt(activities.reduce((n,x)=>n+amount(x.r),0))+'</strong></div><div>活動未收<strong>'+fmt(owed(p))+'</strong></div></div><div class="profile-tabs">'+tabs.map(t=>'<button class="'+(t===tab?'on':'')+'" onclick="sanxunProfile(\''+id+'\',\''+t+'\')">'+t+'</button>').join('')+'</div><div class="datawrap">'+table+'</div><div class="notice">活動收款與財務收入分開顯示，不重複加總。未收款依活動報名的應收與已收計算；「是否已開立請款單」目前無獨立欄位，尚不能判定為未請款。財務頁面可查看既有紀錄，正式版需再建立唯一交易 ID 以完整同步。</div>';
};
if(current==='信眾管理')redraw();
})();
</script>
</body></html>
